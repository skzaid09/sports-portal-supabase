
 <!DOCTYPE html>
<html>
<head>
  <title>Coordinator Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #f5f7fa; }
    .card { border-radius: 12px; }
  </style>
</head>

<body>

<nav class="navbar navbar-dark bg-warning">
  <div class="container">
    <span class="navbar-brand">Coordinator Dashboard</span>
  </div>
</nav>

<div class="container mt-4">

  <div class="card p-4 shadow mb-4">
    <h4>📅 Schedule Match</h4>

    <form id="scheduleForm">
      <input class="form-control mb-2" id="event" placeholder="Event" required>
      <input class="form-control mb-2" id="team1" placeholder="Team 1" required>
      <input class="form-control mb-2" id="team2" placeholder="Team 2" required>
      <input class="form-control mb-3" type="date" id="date" required>

      <button class="btn btn-warning w-100">Schedule Match</button>
    </form>
  </div>


  <div class="card p-4 shadow">
    <h4>🎮 Matches</h4>

    <table class="table table-bordered mt-3">
      <thead>
        <tr>
          <th>Event</th>
          <th>Team 1</th>
          <th>Team 2</th>
          <th>Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="matchTable"></tbody>
    </table>
  </div>

</div>


<script>

async function loadMatches() {
  const res = await fetch("/coord/api/get-matches");
  const matches = await res.json();

  let rows = "";

  matches.forEach(m => {
    rows += `
      <tr>
        <td>${m.event}</td>
        <td>${m.team1}</td>
        <td>${m.team2}</td>
        <td>${m.date}</td>
        <td>${m.status}</td>
      </tr>
    `;
  });

  document.getElementById("matchTable").innerHTML = rows;
}


document.getElementById("scheduleForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const data = {
    event: document.getElementById("event").value,
    team1: document.getElementById("team1").value,
    team2: document.getElementById("team2").value,
    date: document.getElementById("date").value
  };

  const res = await fetch("/coord/api/schedule-match", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });

  const result = await res.json();

  if(result.success){
    alert("Match Scheduled Successfully!");
    document.getElementById("scheduleForm").reset();
    loadMatches();
  } else {
    alert("Error scheduling match.");
  }
});

loadMatches();

</script>

</body>
</html>
