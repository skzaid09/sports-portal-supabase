<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coordinator Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4">📅 Coordinator Dashboard</h2>

    <!-- MATCH FORM -->
    <div class="card p-3 shadow mb-4">
        <h5>Create Match</h5>
        <form id="matchForm">
            <input class="form-control mb-2" id="event" placeholder="Event Name" required>
            <input class="form-control mb-2" id="team1" placeholder="Team 1" required>
            <input class="form-control mb-2" id="team2" placeholder="Team 2" required>
            <input class="form-control mb-2" type="date" id="date" required>

            <button class="btn btn-warning w-100">Schedule Match</button>
        </form>
    </div>

    <!-- MATCH TABLE -->
    <div class="card p-3 shadow">
        <h5>Scheduled Matches</h5>

        <table class="table table-striped">
            <tr>
                <th>Event</th>
                <th>Team 1</th>
                <th>Team 2</th>
                <th>Date</th>
                <th>Status</th>
            </tr>

            {% for m in matches %}
            <tr>
                <td>{{ m.event }}</td>
                <td>{{ m.team1 }}</td>
                <td>{{ m.team2 }}</td>
                <td>{{ m.date }}</td>
                <td>{{ m.status }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

</div>


<script>
document.getElementById("matchForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const data = {
        event: document.getElementById("event").value,
        team1: document.getElementById("team1").value,
        team2: document.getElementById("team2").value,
        date: document.getElementById("date").value
    };

    const res = await fetch("/coord/api/match", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    const result = await res.json();

    if(result.success){
        alert("Match scheduled successfully!");
        location.reload();
    } else {
        alert("Error saving match!");
    }
});
</script>

</body>
</html>
