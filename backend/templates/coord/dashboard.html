<!DOCTYPE html>
<html>
<head>
<title>Coordinator Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
}

.navbar{
    background:linear-gradient(to right,#000428,#004e92);
}

.card{
    border-radius:18px;
    background:rgba(255,255,255,0.95);
}

.section-title{
    font-weight:600;
    margin-bottom:15px;
}

select,input{
    height:45px;
}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark shadow">
<div class="container">
<span class="navbar-brand fw-bold">📅 Coordinator Panel</span>
<a href="/" class="btn btn-outline-light btn-sm">Logout</a>
</div>
</nav>

<div class="container mt-5 mb-5">

<!-- SCHEDULE MATCH -->

<div class="card p-4 shadow mb-4">

<h4 class="section-title">⚽ Schedule Match</h4>

<form id="scheduleForm">

<label class="form-label">Select Event</label>
<select class="form-control mb-3" id="eventName" required></select>

<label class="form-label">Team 1</label>
<select class="form-control mb-3" id="team1" required></select>

<label class="form-label">Team 2</label>
<select class="form-control mb-3" id="team2" required></select>

<label class="form-label">Match Date</label>
<input class="form-control mb-3" type="date" id="date" required>

<button class="btn btn-dark w-100">Schedule Match</button>

</form>

</div>


<!-- MATCHES TABLE -->

<div class="card p-4 shadow">

<h4 class="section-title">🎮 Scheduled Matches</h4>

<table class="table table-striped mt-3">

<thead class="table-dark">
<tr>
<th>Event</th>
<th>Team 1</th>
<th>Team 2</th>
<th>Date</th>
<th>Status</th>
</tr>
</thead>

<tbody id="matchTable"></tbody>

</table>

</div>

</div>


<!-- TOAST MESSAGE -->

<div class="position-fixed bottom-0 end-0 p-3">
<div id="liveToast" class="toast text-bg-success border-0">
<div class="d-flex">
<div class="toast-body" id="toastMessage"></div>
<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
</div>
</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>


function showToast(message,type="success"){
const toastEl=document.getElementById("liveToast")
toastEl.className="toast text-bg-"+type+" border-0"
document.getElementById("toastMessage").innerText=message
new bootstrap.Toast(toastEl).show()
}



async function loadEvents(){

const res = await fetch("/coord/api/events")
const events = await res.json()

let options = "<option value=''>Select Event</option>"

events.forEach(e=>{
options += `<option value="${e.name}">${e.name}</option>`
})

document.getElementById("eventName").innerHTML = options

}



async function loadTeams(){

const res = await fetch("/coord/api/teams")
const teams = await res.json()

let options = "<option value=''>Select Team</option>"

teams.forEach(t=>{
options += `<option value="${t.team_name}">${t.team_name}</option>`
})

document.getElementById("team1").innerHTML = options
document.getElementById("team2").innerHTML = options

}



async function loadMatches(){

const res = await fetch("/coord/api/get-matches")
const matches = await res.json()

let rows = ""

matches.forEach(m=>{

rows += `
<tr>
<td>${m.event ?? "-"}</td>
<td>${m.team1}</td>
<td>${m.team2}</td>
<td>${m.date}</td>
<td>${m.status}</td>
</tr>
`

})

document.getElementById("matchTable").innerHTML = rows

}



document.getElementById("scheduleForm").addEventListener("submit",async function(e){

e.preventDefault()

const event = document.getElementById("eventName").value
const team1 = document.getElementById("team1").value
const team2 = document.getElementById("team2").value
const date = document.getElementById("date").value


if(team1 === team2){
showToast("Team1 and Team2 cannot be same","danger")
return
}


const data={
event:event,
team1:team1,
team2:team2,
date:date
}


const res = await fetch("/coord/api/schedule-match",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
})

const result = await res.json()

if(result.success){

showToast("Match Scheduled Successfully!")

document.getElementById("scheduleForm").reset()

loadMatches()

}
else{
showToast("Error scheduling match","danger")
}

})



async function loadEvents(){

const res = await fetch("/coord/api/events")
const events = await res.json()

let options="<option value=''>Select Event</option>"

events.forEach(e=>{
if(e.type==="Team"){
options+=`<option value="${e.name}">${e.name}</option>`
}
})

document.getElementById("eventName").innerHTML=options

}

loadTeams()
loadMatches()

</script>

</body>
</html>
