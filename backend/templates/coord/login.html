<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinator Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;

      /* 🔥 SPORTS + SYSTEM FLOW BACKGROUND (LIKE YOUR IMAGE) */
      background-image: url("https://img.freepik.com/free-photo/sports-tools_53876-138077.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    /* 🔥 BLUE + RED OVERLAY (LIKE YOUR IMAGE STYLE) */
    body::before{
      content:"";
      position:absolute;
      width:100%;
      height:100%;
      background: linear-gradient(
        90deg,
        rgba(2, 38, 75, 0.75),
        rgba(88, 0, 0, 0.75)
      );
      backdrop-filter: blur(3px);
      z-index:0;
    }

    /* 🔥 GLASS CARD */
    .login-card{
      position: relative;
      z-index:1;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      animation: fadeIn 0.7s ease;
    }

    /* Animation */
    @keyframes fadeIn{
      from{
        opacity:0;
        transform: translateY(25px);
      }
      to{
        opacity:1;
        transform: translateY(0);
      }
    }

    h3{
      font-weight:700;
      color:#ff9800;
    }

    label{
      font-weight:500;
      color:#333;
    }

    .form-control{
      border-radius:12px;
      padding:10px;
    }

    /* 🔥 Coordinator Button */
    .btn-warning{
      border-radius: 30px;
      padding: 10px;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-warning:hover{
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .input-group-text{
      background:#fff;
    }

  </style>
</head>

<body>

<div class="login-card">

<h3 class="text-center mb-4">📋 Coordinator Login</h3>

<form id="loginForm">

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" id="email" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>

<div class="input-group">

<input type="password" class="form-control" id="password" required>

<span class="input-group-text" style="cursor:pointer;" onclick="togglePassword()">

<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
<path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8z"/>
<path d="M8 3a5 5 0 1 0 0 10A5 5 0 0 0 8 3z"/>
</svg>

</span>

</div>
</div>

<input type="hidden" id="role" value="coord">

<button type="submit" class="btn btn-warning w-100">Login</button>

</form>

<div id="error" class="mt-3 text-danger text-center" style="display:none;"></div>

</div>


<script>

function togglePassword(){
const pass=document.getElementById('password');
pass.type = pass.type === "password" ? "text" : "password";
}

document.getElementById('loginForm').addEventListener('submit', async (e)=>{

e.preventDefault();

const email=document.getElementById('email').value;
const password=document.getElementById('password').value;
const role=document.getElementById('role').value;

const res=await fetch('/api/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({email,password,role})
});

const data=await res.json();

if(data.success){
window.location.href=data.redirect;
}else{
document.getElementById('error').textContent=data.message;
document.getElementById('error').style.display='block';
}

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
