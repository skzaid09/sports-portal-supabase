<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Access</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#000,#222);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.card{
border-radius:20px;
padding:40px;
text-align:center;
}

#qrcode{
margin:auto;
}

</style>

</head>

<body>

<div class="card shadow-lg">

<h3 class="mb-4">📱 Scan QR to Access Sports Portal</h3>

<div id="qrcode"></div>

<p class="text-muted mt-3">Scan using your phone</p>

<a href="/roles" class="btn btn-dark mt-3">Continue</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

<script>

new QRCode(document.getElementById("qrcode"), {
text: window.location.origin + "/roles",
width: 220,
height: 220
});

</script>

</body>
</html>
