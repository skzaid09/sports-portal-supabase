<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#1f4037,#99f2c8);
min-height:100vh;
}

.navbar{
background:linear-gradient(to right,#000428,#004e92);
}

.card{
border-radius:18px;
background:rgba(255,255,255,0.95);
}

.stat-card{
text-align:center;
padding:25px;
}

.btn-dark{
border-radius:30px;
}

.btn-danger:hover{
transform:scale(1.05);
}

</style>

</head>

<body>

<nav class="navbar navbar-dark shadow">
<div class="container-fluid px-3">
<span class="navbar-brand fw-bold">👑 Admin Dashboard</span>
<a href="/" class="btn btn-outline-light btn-sm">Logout</a>
</div>
</nav>

<div class="container mt-5 mb-5">

<!-- STATS -->

<div class="row mb-4">

<div class="col-lg-4 col-md-6 col-12">
<div class="card shadow stat-card">
<h6>Total Players</h6>
<h2 id="playerCount">0</h2>
</div>
</div>

<div class="col-lg-4 col-md-6 col-12">
<div class="card shadow stat-card">
<h6>Total Teams</h6>
<h2 id="teamCount">0</h2>
</div>
</div>

<div class="col-lg-4 col-md-6 col-12">
<div class="card shadow stat-card">
<h6>Total Events</h6>
<h2 id="eventCount">0</h2>
</div>
</div>

</div>


<!-- CREATE EVENT -->

<div class="card shadow p-4 mb-4">

<h4>Create Event</h4>

<form id="eventForm">

<div class="row">

<div class="col-lg-3">
<input class="form-control mb-2" id="eventName" placeholder="Event Name" required>
</div>

<div class="col-lg-3">
<select class="form-control mb-2" id="eventType" required>
<option value="">Select Type</option>
<option value="Individual">Individual</option>
<option value="Team">Team</option>
</select>
</div>

<div class="col-lg-3">
<input type="date" class="form-control mb-2" id="eventDate" required>
</div>

<div class="col-lg-3">
<input class="form-control mb-2" id="eventLocation" placeholder="Location" required>
</div>

</div>

<div id="loader" class="text-center mb-3" style="display:none;">
<div class="spinner-border text-primary"></div>
<p class="mt-2">Creating Event...</p>
</div>

<button class="btn btn-dark w-100 mt-2">Create Event</button>

</form>

</div>


<!-- EVENTS -->

<div class="card shadow p-4 mb-4">

<h4>📅 Events</h4>

<div class="table-responsive">
<table class="table table-striped">

<thead>
<tr>
<th>Name</th>
<th>Type</th>
<th>Date</th>
<th>Location</th>
<th>Action</th>
</tr>
</thead>

<tbody id="eventTable"></tbody>

</table>
</div>

</div>


<!-- PLAYERS -->

<div class="card shadow p-4 mb-4">

<h4>🎮 Players</h4>

<div class="table-responsive">
<table class="table table-striped">

<thead>
<tr>
<th>Name</th>
<th>School</th>
<th>Roll</th>
<th>Sport</th>
<th>Gender</th>
<th>Action</th>
</tr>
</thead>

<tbody id="playerTable"></tbody>

</table>
</div>

</div>


<!-- TEAMS -->

<div class="card shadow p-4">

<h4>🏆 Teams</h4>

<div class="table-responsive">
<table class="table table-striped">

<thead>
<tr>
<th>Team</th>
<th>School</th>
<th>Sport</th>
<th>Action</th>
</tr>
</thead>

<tbody id="teamTable"></tbody>

</table>
</div>

</div>

</div>


<!-- TOAST -->

<div class="position-fixed bottom-0 end-0 p-3">

<div id="liveToast" class="toast text-bg-success border-0">

<div class="d-flex">

<div class="toast-body" id="toastMessage"></div>

<button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>

</div>

</div>

</div>


<!-- DELETE CONFIRM MODAL -->

<div class="modal fade" id="confirmModal" tabindex="-1">
<div class="modal-dialog modal-dialog-centered">

<div class="modal-content">

<div class="modal-header bg-danger text-white">
<h5 class="modal-title">Confirm Delete</h5>
<button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body text-center">
<p id="confirmText">Are you sure?</p>
</div>

<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
<button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
</div>

</div>

</div>
</div>

<!-- EVENT ANALYTICS DASHBOARD -->

<div class="container mb-5">

<h3 class="mb-4">📊 Event Analytics</h3>

<div id="analyticsContainer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

function showToast(message,type="success"){

const toastEl=document.getElementById("liveToast")

toastEl.className="toast text-bg-"+type+" border-0"

document.getElementById("toastMessage").innerText=message

new bootstrap.Toast(toastEl).show()

}

let deleteType=null
let deleteId=null


function openDeleteModal(type,id,text){

deleteType=type
deleteId=id

document.getElementById("confirmText").innerText=text

new bootstrap.Modal(document.getElementById("confirmModal")).show()

}


document.getElementById("confirmDeleteBtn").addEventListener("click",async ()=>{

if(deleteType==="player"){
await fetch("/admin/api/delete-player/"+deleteId,{method:"DELETE"})
showToast("Player Deleted","danger")
loadPlayers()
}

if(deleteType==="team"){
await fetch("/admin/api/delete-team/"+deleteId,{method:"DELETE"})
showToast("Team Deleted","danger")
loadTeams()
}

if(deleteType==="event"){
await fetch("/admin/api/delete-event/"+deleteId,{method:"DELETE"})
showToast("Event Deleted","danger")
loadEvents()
}

bootstrap.Modal.getInstance(document.getElementById("confirmModal")).hide()

})


async function loadPlayers(){

const res = await fetch("/admin/api/players")
const data = await res.json()

document.getElementById("playerCount").innerText=data.length

let rows=""

data.forEach(p=>{
rows+=`
<tr>
<td>${p.name}</td>
<td>${p.school}</td>
<td>${p.gender}</td>
<td>${p.roll_no}</td>
<td>${p.sport}</td>
<td>
<button class="btn btn-danger btn-sm"
onclick="openDeleteModal('player','${p.id}','Delete this player?')">
Delete
</button>
</td>
</tr>
`
})

playerTable.innerHTML=rows

}


async function loadTeams(){

const res = await fetch("/admin/api/teams")
const data = await res.json()

document.getElementById("teamCount").innerText=data.length

let rows=""

data.forEach(t=>{
rows+=`
<tr>
<td>${t.team_name}</td>
<td>${t.school}</td>
<td>${t.sport}</td>
<td>
<button class="btn btn-danger btn-sm"
onclick="openDeleteModal('team','${t.id}','Delete this team?')">
Delete
</button>
</td>
</tr>
`
})

teamTable.innerHTML=rows

}


async function loadEvents(){

const res = await fetch("/admin/api/events")
const data = await res.json()

document.getElementById("eventCount").innerText=data.length

let rows=""

data.forEach(e=>{
rows+=`
<tr>
<td>${e.name}</td>
<td>${e.type}</td>
<td>${e.date}</td>
<td>${e.location}</td>
<td>
<button class="btn btn-danger btn-sm"
onclick="openDeleteModal('event','${e.id}','Delete this event?')">
Delete
</button>
</td>
</tr>
`
})

eventTable.innerHTML=rows

}


document.getElementById("eventForm").addEventListener("submit",async function(e){

e.preventDefault()

const loader=document.getElementById("loader")
loader.style.display="block"

const data={
name:eventName.value,
type:eventType.value,
date:eventDate.value,
location:eventLocation.value
}

const res=await fetch("/admin/api/create-event",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
})

loader.style.display="none"

const result=await res.json()

if(result.success){
showToast("Event Created Successfully 🎉")
this.reset()
loadEvents()
}
else{
showToast("Error Creating Event","danger")
}

})

async function loadAnalytics(){

const res = await fetch("/admin/api/event-analytics")
const data = await res.json()

let html=""

data.forEach(event=>{

let engRows=""
let pharmRows=""
let archRows=""

event.players.forEach(p=>{

let row=`
<tr>
<td>${p.name}</td>
<td>${p.roll_no}</td>
<td>${p.gender}</td>
<td>
<button class="btn btn-sm btn-danger"
onclick="openDeleteModal('player','${p.id}','Delete this player?')">
Delete
</button>
</td>
</tr>
`

if(p.school==="School of Engineering") engRows+=row
if(p.school==="School of Pharmacy") pharmRows+=row
if(p.school==="School of Architecture") archRows+=row

})

html+=`

<div class="card shadow p-4 mb-4">

<h4 class="mb-3">🏅 ${event.event}</h4>

<div class="row">

<div class="col-md-4">

<h6>School of Engineering</h6>

<table class="table table-sm">
<thead>
<tr>
<th>Name</th>
<th>Roll</th>
<th>Gender</th>
<th></th>
</tr>
</thead>
<tbody>
${engRows || "<tr><td colspan='4'>No registrations</td></tr>"}
</tbody>
</table>

</div>


<div class="col-md-4">

<h6>School of Pharmacy</h6>

<table class="table table-sm">
<thead>
<tr>
<th>Name</th>
<th>Roll</th>
<th>Gender</th>
<th></th>
</tr>
</thead>
<tbody>
${pharmRows || "<tr><td colspan='4'>No registrations</td></tr>"}
</tbody>
</table>

</div>


<div class="col-md-4">

<h6>School of Architecture</h6>

<table class="table table-sm">
<thead>
<tr>
<th>Name</th>
<th>Roll</th>
<th>Gender</th>
<th></th>
</tr>
</thead>
<tbody>
${archRows || "<tr><td colspan='4'>No registrations</td></tr>"}
</tbody>
</table>

</div>

</div>

</div>

`

})

document.getElementById("analyticsContainer").innerHTML=html

}

loadPlayers()
loadTeams()
loadEvents()
loadAnalytics()

</script>

</body>
</html>
