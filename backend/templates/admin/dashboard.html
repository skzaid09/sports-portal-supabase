<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#1f4037,#99f2c8);
min-height:100vh;
}

.navbar{
background:linear-gradient(to right,#000428,#004e92);
}

.card{
border-radius:18px;
background:rgba(255,255,255,0.95);
}

.stat-card{
text-align:center;
padding:25px;
}

.btn-dark{
border-radius:30px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark shadow">
<div class="container">
<span class="navbar-brand fw-bold">👑 Admin Dashboard</span>
<a href="/" class="btn btn-outline-light btn-sm">Logout</a>
</div>
</nav>

<div class="container mt-5 mb-5">

<!-- STATS -->

<div class="row mb-4">

<div class="col-md-4">
<div class="card shadow stat-card">
<h6>Total Players</h6>
<h2 id="playerCount">0</h2>
</div>
</div>

<div class="col-md-4">
<div class="card shadow stat-card">
<h6>Total Teams</h6>
<h2 id="teamCount">0</h2>
</div>
</div>

<div class="col-md-4">
<div class="card shadow stat-card">
<h6>Total Events</h6>
<h2 id="eventCount">0</h2>
</div>
</div>

</div>


<!-- CREATE EVENT -->

<div class="card shadow p-4 mb-4">

<h4>Create Event</h4>

<form id="eventForm">

<div class="row">

<div class="col-md-3">
<input class="form-control mb-2" id="eventName" placeholder="Event Name" required>
</div>

<div class="col-md-3">
<select class="form-control mb-2" id="eventType" required>
<option value="">Select Type</option>
<option value="Individual">Individual</option>
<option value="Team">Team</option>
</select>
</div>

<div class="col-md-3">
<input type="date" class="form-control mb-2" id="eventDate" required>
</div>

<div class="col-md-3">
<input class="form-control mb-2" id="eventLocation" placeholder="Location" required>
</div>

</div>

<button class="btn btn-dark w-100 mt-2">Create Event</button>

</form>

</div>


<!-- EVENTS TABLE -->

<div class="card shadow p-4 mb-4">

<h4>📅 Events</h4>

<table class="table table-striped mt-3">

<thead>
<tr>
<th>Name</th>
<th>Type</th>
<th>Date</th>
<th>Location</th>
<th>Action</th>
</tr>
</thead>

<tbody id="eventTable"></tbody>

</table>

</div>


<!-- PLAYERS TABLE -->

<div class="card shadow p-4 mb-4">

<h4>🎮 Players</h4>

<table class="table table-striped mt-3">

<thead>
<tr>
<th>Name</th>
<th>Department</th>
<th>Roll</th>
<th>Sport</th>
<th>Action</th>
</tr>
</thead>

<tbody id="playerTable"></tbody>

</table>

</div>


<!-- TEAMS TABLE -->

<div class="card shadow p-4">

<h4>🏆 Teams</h4>

<table class="table table-striped mt-3">

<thead>
<tr>
<th>Team</th>
<th>Department</th>
<th>Sport</th>
<th>Action</th>
</tr>
</thead>

<tbody id="teamTable"></tbody>

</table>

</div>

</div>


<!-- TOAST MESSAGE -->

<div class="position-fixed bottom-0 end-0 p-3">

<div id="liveToast" class="toast text-bg-success border-0">

<div class="d-flex">

<div class="toast-body" id="toastMessage"></div>

<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

function showToast(message,type="success"){

const toastEl=document.getElementById("liveToast")

toastEl.className="toast text-bg-"+type+" border-0"

document.getElementById("toastMessage").innerText=message

new bootstrap.Toast(toastEl).show()

}


async function loadPlayers(){

const res = await fetch("/admin/api/players")
const data = await res.json()

document.getElementById("playerCount").innerText=data.length

let rows=""

data.forEach(p=>{

rows+=`
<tr>
<td>${p.name}</td>
<td>${p.department}</td>
<td>${p.roll_no}</td>
<td>${p.sport}</td>
<td><button class="btn btn-danger btn-sm" onclick="deletePlayer('${p.id}')">Delete</button></td>
</tr>
`

})

document.getElementById("playerTable").innerHTML=rows

}



async function loadTeams(){

const res = await fetch("/admin/api/teams")
const data = await res.json()

document.getElementById("teamCount").innerText=data.length

let rows=""

data.forEach(t=>{

rows+=`
<tr>
<td>${t.team_name}</td>
<td>${t.department}</td>
<td>${t.sport}</td>
<td><button class="btn btn-danger btn-sm" onclick="deleteTeam('${t.id}')">Delete</button></td>
</tr>
`

})

document.getElementById("teamTable").innerHTML=rows

}



async function loadEvents(){

const res = await fetch("/admin/api/events")
const data = await res.json()

document.getElementById("eventCount").innerText=data.length

let rows=""

data.forEach(e=>{

rows+=`
<tr>
<td>${e.name}</td>
<td>${e.type}</td>
<td>${e.date}</td>
<td>${e.location}</td>
<td><button class="btn btn-danger btn-sm" onclick="deleteEvent('${e.id}')">Delete</button></td>
</tr>
`

})

document.getElementById("eventTable").innerHTML=rows

}



document.getElementById("eventForm").addEventListener("submit",async function(e){

e.preventDefault()

const data={

name:document.getElementById("eventName").value,
type:document.getElementById("eventType").value,
date:document.getElementById("eventDate").value,
location:document.getElementById("eventLocation").value

}

const res=await fetch("/admin/api/create-event",{

method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)

})

const result=await res.json()

if(result.success){

showToast("Event Created")

this.reset()

loadEvents()

}else{

showToast("Error Creating Event","danger")

}

})



async function deletePlayer(id){

await fetch("/admin/api/delete-player/"+id,{method:"DELETE"})

showToast("Player Deleted","danger")

loadPlayers()

}



async function deleteTeam(id){

await fetch("/admin/api/delete-team/"+id,{method:"DELETE"})

showToast("Team Deleted","danger")

loadTeams()

}



async function deleteEvent(id){

await fetch("/admin/api/delete-event/"+id,{method:"DELETE"})

showToast("Event Deleted","danger")

loadEvents()

}



loadPlayers()
loadTeams()
loadEvents()

</script>

</body>
</html>
