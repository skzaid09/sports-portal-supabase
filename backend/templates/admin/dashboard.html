<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background:#f4f6f9; }
    .card { border-radius:14px; }
    .stat-card {
        text-align:center;
        padding:20px;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand">👑 Admin Dashboard</span>
  </div>
</nav>

<div class="container mt-4">

  <!-- STATS -->
  <div class="row mb-4">
    <div class="col-md-6">
      <div class="card shadow stat-card">
        <h5>Total Players</h5>
        <h2 id="playerCount">0</h2>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow stat-card">
        <h5>Total Teams</h5>
        <h2 id="teamCount">0</h2>
      </div>
    </div>
  </div>


  <!-- PLAYERS -->
  <div class="card shadow p-4 mb-4">
    <h4>🎮 Registered Players</h4>

    <table class="table table-bordered mt-3">
      <thead>
        <tr>
          <th>Name</th>
          <th>Department</th>
          <th>Roll</th>
          <th>Sport</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="playerTable"></tbody>
    </table>
  </div>


  <!-- TEAMS -->
  <div class="card shadow p-4">
    <h4>🏆 Teams</h4>

    <table class="table table-bordered mt-3">
      <thead>
        <tr>
          <th>Team</th>
          <th>Department</th>
          <th>Sport</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="teamTable"></tbody>
    </table>
  </div>

</div>


<script>

async function loadPlayers(){
  const res = await fetch("/admin/api/players");
  const players = await res.json();

  document.getElementById("playerCount").innerText = players.length;

  let rows = "";
  players.forEach(p => {
    rows += `
      <tr>
        <td>${p.name}</td>
        <td>${p.department}</td>
        <td>${p.roll_no}</td>
        <td>${p.sport}</td>
        <td>
          <button class="btn btn-sm btn-danger"
            onclick="deletePlayer('${p.id}')">
            Delete
          </button>
        </td>
      </tr>
    `;
  });

  document.getElementById("playerTable").innerHTML = rows;
}


async function loadTeams(){
  const res = await fetch("/admin/api/teams");
  const teams = await res.json();

  document.getElementById("teamCount").innerText = teams.length;

  let rows = "";
  teams.forEach(t => {
    rows += `
      <tr>
        <td>${t.team_name}</td>
        <td>${t.department}</td>
        <td>${t.sport}</td>
        <td>
          <button class="btn btn-sm btn-danger"
            onclick="deleteTeam('${t.id}')">
            Delete
          </button>
        </td>
      </tr>
    `;
  });

  document.getElementById("teamTable").innerHTML = rows;
}


async function deletePlayer(id){
  if(confirm("Delete this player?")){
    await fetch("/admin/api/delete-player/"+id, {method:"DELETE"});
    loadPlayers();
  }
}


async function deleteTeam(id){
  if(confirm("Delete this team?")){
    await fetch("/admin/api/delete-team/"+id, {method:"DELETE"});
    loadTeams();
  }
}


loadPlayers();
loadTeams();

</script>

</body>
</html>
