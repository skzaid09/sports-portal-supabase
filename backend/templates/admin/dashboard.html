<!-- FULL UPDATED ADMIN DASHBOARD -->

<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#1f4037,#99f2c8);
min-height:100vh;
}

.navbar{
background:linear-gradient(to right,#000428,#004e92);
}

.card{
border-radius:18px;
background:rgba(255,255,255,0.95);
}

.stat-card{
text-align:center;
padding:25px;
}

.event-card{
border-left:6px solid #0d6efd;
}

.school-title{
font-weight:600;
margin-bottom:8px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark shadow">
<div class="container-fluid px-3">
<span class="navbar-brand fw-bold">👑 Admin Dashboard</span>
<a href="/" class="btn btn-outline-light btn-sm">Logout</a>
</div>
</nav>

<div class="container mt-5 mb-5">

<!-- STATS -->

<div class="row mb-4">

<div class="col-lg-4">
<div class="card shadow stat-card">
<h6>Total Players</h6>
<h2 id="playerCount">0</h2>
</div>
</div>

<div class="col-lg-4">
<div class="card shadow stat-card">
<h6>Total Teams</h6>
<h2 id="teamCount">0</h2>
</div>
</div>

<div class="col-lg-4">
<div class="card shadow stat-card">
<h6>Total Events</h6>
<h2 id="eventCount">0</h2>
</div>
</div>

</div>


<!-- CREATE EVENT -->

<div class="card shadow p-4 mb-4">

<h4>Create Event</h4>

<form id="eventForm">

<div class="row">

<div class="col-md-3">
<input class="form-control mb-2" id="eventName" placeholder="Event Name" required>
</div>

<div class="col-md-3">
<select class="form-control mb-2" id="eventType" required>
<option value="">Select Type</option>
<option value="Individual">Individual</option>
<option value="Team">Team</option>
</select>
</div>

<div class="col-md-3">
<input type="date" class="form-control mb-2" id="eventDate" required>
</div>

<div class="col-md-3">
<input class="form-control mb-2" id="eventLocation" placeholder="Location" required>
</div>

</div>

<button class="btn btn-dark w-100 mt-2">Create Event</button>

</form>

</div>


<!-- EVENTS TABLE -->

<div class="card shadow p-4 mb-5">

<h4>📅 Events</h4>

<table class="table table-striped">

<thead>
<tr>
<th>Name</th>
<th>Type</th>
<th>Date</th>
<th>Location</th>
<th>Action</th>
</tr>
</thead>

<tbody id="eventTable"></tbody>

</table>

</div>

</div>


<!-- ANALYTICS -->

<div class="container mb-5">

<h3 class="mb-4">📊 Event Analytics</h3>

<div id="analyticsContainer"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

function showToast(message,type="success"){
const toast=document.createElement("div")
toast.className="toast show position-fixed bottom-0 end-0 m-3 text-bg-"+type
toast.innerHTML=`<div class="toast-body">${message}</div>`
document.body.appendChild(toast)
setTimeout(()=>toast.remove(),3000)
}


async function loadEvents(){

const res = await fetch("/admin/api/events")
let data = await res.json()

document.getElementById("eventCount").innerText=data.length

// SORT EVENTS
data.sort((a,b)=>{

if(a.type==="Individual" && b.type==="Team") return -1
if(a.type==="Team" && b.type==="Individual") return 1

return new Date(a.date)-new Date(b.date)

})

let rows=""

data.forEach(e=>{

rows+=`
<tr>
<td>${e.name}</td>
<td>${e.type}</td>
<td>${e.date}</td>
<td>${e.location}</td>
<td>
<button class="btn btn-danger btn-sm"
onclick="deleteEvent('${e.id}')">
Delete
</button>
</td>
</tr>
`

})

eventTable.innerHTML=rows

}


async function deleteEvent(id){

if(!confirm("Delete this event?")) return

await fetch("/admin/api/delete-event/"+id,{method:"DELETE"})

showToast("Event Deleted","danger")

loadEvents()

}


document.getElementById("eventForm").addEventListener("submit",async function(e){

e.preventDefault()

const data={
name:eventName.value,
type:eventType.value,
date:eventDate.value,
location:eventLocation.value
}

const res=await fetch("/admin/api/create-event",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
})

const result=await res.json()

if(result.success){

showToast("Event Created 🎉")

this.reset()

loadEvents()
loadAnalytics()

}else{

showToast("Error","danger")

}

})



async function loadAnalytics(){

const res = await fetch("/admin/api/event-analytics")

const events = await res.json()

let individual=[]
let team=[]

events.forEach(e=>{
if(e.type==="Individual") individual.push(e)
else team.push(e)
})

individual.sort((a,b)=>new Date(a.date)-new Date(b.date))
team.sort((a,b)=>new Date(a.date)-new Date(b.date))

let html=""

html+="<h4 class='mb-3'>Individual Events</h4>"

individual.forEach(e=>{
html+=createEventCard(e)
})

html+="<h4 class='mt-5 mb-3'>Team Events</h4>"

team.forEach(e=>{
html+=createEventCard(e)
})

analyticsContainer.innerHTML=html

}


function createEventCard(event){

let eng=[]
let pharm=[]
let arch=[]

event.players.forEach(p=>{

if(p.school==="School of Engineering") eng.push(p)
if(p.school==="School of Pharmacy") pharm.push(p)
if(p.school==="School of Architecture") arch.push(p)

})

function sortPlayers(arr){

return arr.sort((a,b)=>{

if(a.gender==="Girl" && b.gender==="Boy") return -1
if(a.gender==="Boy" && b.gender==="Girl") return 1

return a.roll_no.localeCompare(b.roll_no)

})

}

eng=sortPlayers(eng)
pharm=sortPlayers(pharm)
arch=sortPlayers(arch)

function rows(players){

if(players.length===0) return "<tr><td colspan='3'>No registrations</td></tr>"

let r=""

players.forEach(p=>{
r+=`
<tr>
<td>${p.name}</td>
<td>${p.roll_no}</td>
<td>${p.gender}</td>
</tr>
`
})

return r

}

return `

<div class="card shadow p-4 mb-4 event-card">

<h4>🏅 ${event.event} (${event.players.length} Participants)</h4>

<div class="row">

<div class="col-md-4">

<div class="school-title">
School of Engineering (${eng.length})
</div>

<table class="table table-sm">
<thead>
<tr>
<th>Name</th>
<th>Roll</th>
<th>Gender</th>
</tr>
</thead>
<tbody>
${rows(eng)}
</tbody>
</table>

</div>


<div class="col-md-4">

<div class="school-title">
School of Pharmacy (${pharm.length})
</div>

<table class="table table-sm">
<thead>
<tr>
<th>Name</th>
<th>Roll</th>
<th>Gender</th>
</tr>
</thead>
<tbody>
${rows(pharm)}
</tbody>
</table>

</div>


<div class="col-md-4">

<div class="school-title">
School of Architecture (${arch.length})
</div>

<table class="table table-sm">
<thead>
<tr>
<th>Name</th>
<th>Roll</th>
<th>Gender</th>
</tr>
</thead>
<tbody>
${rows(arch)}
</tbody>
</table>

</div>

</div>

</div>

`

}


async function loadStats(){

const players=await fetch("/admin/api/players").then(r=>r.json())
const teams=await fetch("/admin/api/teams").then(r=>r.json())

playerCount.innerText=players.length
teamCount.innerText=teams.length

}


loadStats()
loadEvents()
loadAnalytics()

</script>

</body>
</html>
