<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #eef2f3, #dfe9f3);
}
.navbar {
    background: linear-gradient(to right, #141e30, #243b55);
}
.card {
    border-radius: 15px;
}
.stat-card {
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark">
  <div class="container">
    <span class="navbar-brand fs-4">👑 Admin Dashboard</span>
  </div>
</nav>

<div class="container mt-4">

<!-- STAT CARDS -->
<div class="row mb-4">
  <div class="col-md-4">
    <div class="card shadow stat-card">
      <h6>Total Players</h6>
      <h2 id="playerCount">0</h2>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card shadow stat-card">
      <h6>Total Teams</h6>
      <h2 id="teamCount">0</h2>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card shadow stat-card">
      <h6>Total Events</h6>
      <h2 id="eventCount">0</h2>
    </div>
  </div>
</div>


<!-- EVENT CREATION -->
<div class="card shadow p-4 mb-4">
  <h4>Create Event</h4>

  <form id="eventForm">
    <div class="row">
      <div class="col-md-4">
        <input class="form-control mb-2" id="eventName" placeholder="Event Name" required>
      </div>
      <div class="col-md-4">
        <input type="date" class="form-control mb-2" id="eventDate" required>
      </div>
      <div class="col-md-4">
        <input class="form-control mb-2" id="eventLocation" placeholder="Location" required>
      </div>
    </div>

    <button class="btn btn-dark w-100 mt-2">Create Event</button>
  </form>
</div>


<!-- EVENTS LIST -->
<div class="card shadow p-4 mb-4">
  <h4>📅 Events</h4>
  <table class="table table-bordered mt-3">
    <thead>
      <tr>
        <th>Name</th>
        <th>Date</th>
        <th>Location</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="eventTable"></tbody>
  </table>
</div>


<!-- PLAYERS -->
<div class="card shadow p-4 mb-4">
  <h4>🎮 Players</h4>
  <table class="table table-bordered mt-3">
    <thead>
      <tr>
        <th>Name</th>
        <th>Department</th>
        <th>Roll</th>
        <th>Sport</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="playerTable"></tbody>
  </table>
</div>


<!-- TEAMS -->
<div class="card shadow p-4">
  <h4>🏆 Teams</h4>
  <table class="table table-bordered mt-3">
    <thead>
      <tr>
        <th>Team</th>
        <th>Department</th>
        <th>Sport</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="teamTable"></tbody>
  </table>
</div>

</div>


<script>

async function loadPlayers(){
  const res = await fetch("/admin/api/players");
  const data = await res.json();
  document.getElementById("playerCount").innerText = data.length;

  let rows = "";
  data.forEach(p => {
    rows += `
    <tr>
      <td>${p.name}</td>
      <td>${p.department}</td>
      <td>${p.roll_no}</td>
      <td>${p.sport}</td>
      <td><button class="btn btn-sm btn-danger" onclick="deletePlayer('${p.id}')">Delete</button></td>
    </tr>`;
  });
  document.getElementById("playerTable").innerHTML = rows;
}

async function loadTeams(){
  const res = await fetch("/admin/api/teams");
  const data = await res.json();
  document.getElementById("teamCount").innerText = data.length;

  let rows = "";
  data.forEach(t => {
    rows += `
    <tr>
      <td>${t.team_name}</td>
      <td>${t.department}</td>
      <td>${t.sport}</td>
      <td><button class="btn btn-sm btn-danger" onclick="deleteTeam('${t.id}')">Delete</button></td>
    </tr>`;
  });
  document.getElementById("teamTable").innerHTML = rows;
}

async function loadEvents(){
  const res = await fetch("/admin/api/events");
  const data = await res.json();
  document.getElementById("eventCount").innerText = data.length;

  let rows = "";
  data.forEach(e => {
    rows += `
    <tr>
      <td>${e.name}</td>
      <td>${e.date}</td>
      <td>${e.location}</td>
      <td><button class="btn btn-sm btn-danger" onclick="deleteEvent('${e.id}')">Delete</button></td>
    </tr>`;
  });
  document.getElementById("eventTable").innerHTML = rows;
}

document.getElementById("eventForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const data = {
    name: document.getElementById("eventName").value,
    date: document.getElementById("eventDate").value,
    location: document.getElementById("eventLocation").value
  };

  await fetch("/admin/api/create-event", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
  });

  alert("Event Created Successfully!");
  document.getElementById("eventForm").reset();
  loadEvents();
});

async function deletePlayer(id){
  if(confirm("Delete player?")){
    await fetch("/admin/api/delete-player/"+id, {method:"DELETE"});
    loadPlayers();
  }
}

async function deleteTeam(id){
  if(confirm("Delete team?")){
    await fetch("/admin/api/delete-team/"+id, {method:"DELETE"});
    loadTeams();
  }
}

async function deleteEvent(id){
  if(confirm("Delete event?")){
    await fetch("/admin/api/delete-event/"+id, {method:"DELETE"});
    loadEvents();
  }
}

loadPlayers();
loadTeams();
loadEvents();

</script>

</body>
</html>
