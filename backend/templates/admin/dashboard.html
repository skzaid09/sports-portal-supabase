<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#1f4037,#99f2c8);
min-height:100vh;
}

.navbar{
background:linear-gradient(to right,#000428,#004e92);
}

.card{
border-radius:18px;
background:rgba(255,255,255,0.95);
}

.stat-card{
text-align:center;
padding:25px;
}

.btn-danger:hover{
transform:scale(1.05);
}

</style>

</head>

<body>

<nav class="navbar navbar-dark shadow">
<div class="container-fluid px-3">
<span class="navbar-brand fw-bold">👑 Admin Dashboard</span>
<a href="/" class="btn btn-outline-light btn-sm">Logout</a>
</div>
</nav>


<div class="container mt-5 mb-5">

<!-- STATS -->

<div class="row mb-4">

<div class="col-lg-4">
<div class="card shadow stat-card">
<h6>Individual Players</h6>
<h2 id="playerCount">0</h2>
</div>
</div>

<div class="col-lg-4">
<div class="card shadow stat-card">
<h6>Total Teams</h6>
<h2 id="teamCount">0</h2>
</div>
</div>

<div class="col-lg-4">
<div class="card shadow stat-card">
<h6>Total Events</h6>
<h2 id="eventCount">0</h2>
</div>
</div>

</div>


<!-- CREATE EVENT -->

<div class="card shadow p-4 mb-4">

<h4>Create Event</h4>

<form id="eventForm">

<div class="row">

<div class="col-lg-3">
<input class="form-control mb-2" id="eventName" placeholder="Event Name" required>
</div>

<div class="col-lg-3">
<select class="form-control mb-2" id="eventType" required>
<option value="">Select Type</option>
<option value="Individual">Individual</option>
<option value="Team">Team</option>
</select>
</div>

<div class="col-lg-3">
<input type="date" class="form-control mb-2" id="eventDate" required>
</div>

<div class="col-lg-3">
<input class="form-control mb-2" id="eventLocation" placeholder="Location" required>
</div>

</div>

<button class="btn btn-dark w-100 mt-2">Create Event</button>

</form>

</div>


<!-- EVENTS TABLE -->

<div class="card shadow p-4 mb-4">

<h4>📅 Events</h4>

<table class="table table-striped">

<thead>
<tr>
<th>Name</th>
<th>Type</th>
<th>Date</th>
<th>Location</th>
<th>Action</th>
</tr>
</thead>

<tbody id="eventTable"></tbody>

</table>

</div>

</div>


<div class="container mb-5">

<!-- LEADERBOARD -->

<div class="card shadow p-4 mb-4">

<h4 class="mb-3">🏆 School Leaderboard</h4>

<table class="table table-striped">

<thead>
<tr>
<th>Rank</th>
<th>School</th>
<th>Total Participants</th>
</tr>
</thead>

<tbody id="leaderboardTable"></tbody>

</table>

</div>


<h3 class="mb-4">📊 Event Analytics</h3>

<div id="analyticsContainer"></div>

</div>


<script>
let deleteId = null;
let deleteType = "";

function showToast(msg,type="success"){

const toast=document.createElement("div")

toast.className="toast show position-fixed bottom-0 end-0 m-3 text-bg-"+type

toast.innerHTML=`<div class="toast-body">${msg}</div>`

document.body.appendChild(toast)

setTimeout(()=>toast.remove(),3000)

}


async function loadPlayers(){

const res=await fetch("/admin/api/players")
const data=await res.json()

playerCount.innerText=data.length

}

async function loadTeams(){

const res=await fetch("/admin/api/teams")
const data=await res.json()

teamCount.innerText=data.length

}


async function loadEvents(){

const res=await fetch("/admin/api/events")
let data=await res.json()

eventCount.innerText=data.length

let individual=[]
let team=[]

data.forEach(e=>{
if(e.type==="Individual") individual.push(e)
else team.push(e)
})

individual.sort((a,b)=> new Date(a.date)-new Date(b.date))
team.sort((a,b)=> new Date(a.date)-new Date(b.date))

data=[...individual,...team]

let rows=""

data.forEach(e=>{

rows+=`
<tr>
<td>${e.name}</td>
<td>${e.type}</td>
<td>${e.date}</td>
<td>${e.location}</td>
<td>
<button class="btn btn-danger btn-sm"
onclick="openDeleteModal('${e.id}','event')">
Delete
</button>
</td>
</tr>
`

})

eventTable.innerHTML=rows

}


async function loadAnalytics(){

const res=await fetch("/admin/api/event-analytics")
let data=await res.json()

let individual=[]
let team=[]

data.forEach(e=>{
if(e.type==="Individual") individual.push(e)
else team.push(e)
})

let html=""

html+="<h4>Individual Events</h4>"

individual.forEach(e=>{
html+=renderEventCard(e)
})

html+="<h4 class='mt-4'>Team Events</h4>"

team.forEach(e=>{
html+=renderEventCard(e)
})

analyticsContainer.innerHTML=html

}


function renderEventCard(event){

let eng=[]
let pharm=[]
let arch=[]

event.players.forEach(p=>{

if(p.school==="School of Engineering") eng.push(p)
if(p.school==="School of Pharmacy") pharm.push(p)
if(p.school==="School of Architecture") arch.push(p)

})

function rows(players){

if(players.length===0){
return "<tr><td colspan='4'>No registrations</td></tr>"
}

let grouped={}

players.forEach(p=>{

let team = p.team_name || "Individual"

if(!grouped[team]) grouped[team]=[]

grouped[team].push(p)

})

let html=""

Object.keys(grouped).forEach(team=>{

grouped[team].forEach(p=>{

html+=`
<tr>
<td>${p.name}</td>
<td>${p.roll_no}</td>
<td>${event.type === "Individual" ? p.gender : (team==="Individual" ? "-" : team)}</td>
<td>
<button class="btn btn-sm btn-danger"
onclick="openDeleteModal('${p.id}','player')">
Delete
</button>
</td>
</tr>
`

})

html+=`<tr><td colspan="4"></td></tr>`

})

return html
}

return `

<div class="card shadow p-4 mb-4">

<h4>🏅 ${event.event} (${event.players.length} Participants)</h4>

<div class="row">

<div class="col-md-4">

<h6>School of Engineering (${eng.length})</h6>

<table class="table table-sm">
<thead>
<tr>
<th>Name</th>
<th>Roll</th>
<th>${event.type === "Individual" ? "Gender" : "Team"}</th>
<th></th>
</tr>
</thead>
<tbody>
${rows(eng)}
</tbody>
</table>

</div>

<div class="col-md-4">

<h6>School of Pharmacy (${pharm.length})</h6>

<table class="table table-sm">
<thead>
<tr>
<th>Name</th>
<th>Roll</th>
<th>${event.type === "Individual" ? "Gender" : "Team"}</th>
<th></th>
</tr>
</thead>
<tbody>
${rows(pharm)}
</tbody>
</table>

</div>

<div class="col-md-4">

<h6>School of Architecture (${arch.length})</h6>

<table class="table table-sm">
<thead>
<tr>
<th>Name</th>
<th>Roll</th>
<th>${event.type === "Individual" ? "Gender" : "Team"}</th>
<th></th>
</tr>
</thead>
<tbody>
${rows(arch)}
</tbody>
</table>

</div>

</div>

</div>

`

}


async function loadLeaderboard(){

const res=await fetch("/admin/api/event-analytics")
const data=await res.json()

let schools={
"School of Engineering":0,
"School of Pharmacy":0,
"School of Architecture":0
}

data.forEach(event=>{
event.players.forEach(p=>{
schools[p.school]++
})
})

let arr=Object.entries(schools)

arr.sort((a,b)=>b[1]-a[1])

let medals=["🥇","🥈","🥉"]

let rows=""

arr.forEach((s,i)=>{

rows+=`
<tr>
<td>${medals[i]}</td>
<td>${s[0]}</td>
<td>${s[1]}</td>
</tr>
`

})

leaderboardTable.innerHTML=rows

}

async function deleteEvent(id){

try{

const res = await fetch("/admin/api/delete-event/"+id,{
method:"DELETE"
})

const result = await res.json()

if(result.success){

showToast("Event deleted successfully","danger")

loadEvents()

}else{

showToast("Delete failed","danger")

}

}catch(err){

showToast("Server error","danger")

}

}

function openDeleteModal(id,type){

deleteId = id;
deleteType = type;

document.getElementById("deleteMessage").innerText =
type === "event"
? "Are you sure you want to delete this event?"
: "Are you sure you want to delete this player?";

new bootstrap.Modal(document.getElementById("deleteModal")).show();

}

async function deletePlayer(id){

try{

const res = await fetch("/admin/api/delete-player/"+id,{
method:"DELETE"
})

const result = await res.json()

if(result.success){

showToast("Player deleted successfully","danger")

loadAnalytics()
loadLeaderboard()

}else{

showToast("Delete failed","danger")

}

}catch(err){

showToast("Server error","danger")

}

}

document.getElementById("confirmDeleteBtn").addEventListener("click", async ()=>{

let url = deleteType === "event"
? "/admin/api/delete-event/" + deleteId
: "/admin/api/delete-player/" + deleteId;

try{

const res = await fetch(url,{method:"DELETE"});
const result = await res.json();

if(result.success){

showToast("Deleted successfully","danger");

if(deleteType === "event"){
loadEvents();
}else{
loadAnalytics();
loadLeaderboard();
}

}else{
showToast("Delete failed","danger");
}

}catch{
showToast("Server error","danger");
}

});

loadPlayers()
loadTeams()
loadEvents()
loadAnalytics()
loadLeaderboard()

</script>
<!-- 🔥 PROFESSIONAL DELETE MODAL -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 shadow">

      <div class="modal-header border-0">
        <h5 class="modal-title text-danger">⚠ Confirm Delete</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body text-center">
        <p id="deleteMessage"></p>
        <small class="text-muted">This action cannot be undone.</small>
      </div>

      <div class="modal-footer border-0 justify-content-center">
        <button class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger px-4" id="confirmDeleteBtn">Delete</button>
      </div>

    </div>
  </div>
</div>

</body>
</html>
