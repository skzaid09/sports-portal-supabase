<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    *{
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 20px 15px;
      margin: 0;

      /* 🔥 SPORTS + TECH BACKGROUND (LIKE YOUR IMAGE) */
      background-image: url("https://img.freepik.com/free-photo/sports-tools_53876-138077.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    /* 🔥 DARK + BLUR OVERLAY */
    body::before{
      content:"";
      position:absolute;
      width:100%;
      height:100%;
      background: linear-gradient(
        rgba(0,0,0,0.65),
        rgba(0,30,60,0.65)
      );
      backdrop-filter: blur(3px);
      z-index:0;
    }

    /* 🔥 GLASS CARD */
    .login-card{
      position: relative;
      z-index:1;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 15px 45px rgba(0,0,0,0.35);
      animation: fadeIn 0.7s ease;
      margin: 0 auto;
    }

    /* Animation */
    @keyframes fadeIn{
      from{
        opacity:0;
        transform: translateY(30px);
      }
      to{
        opacity:1;
        transform: translateY(0);
      }
    }

    h3{
      font-weight:700;
      color:#d32f2f;
      font-size: 26px;
      margin-bottom: 25px;
      line-height: 1.3;
    }

    label{
      font-weight:500;
      color:#333;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .form-control{
      border-radius:12px;
      padding:12px 15px;
      font-size: 16px;
      border: 1px solid #ced4da;
      transition: border-color 0.3s;
    }

    .form-control:focus{
      border-color: #dc3545;
      box-shadow: 0 0 0 3px rgba(220,53,69,0.15);
    }

    .input-group{
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #ced4da;
    }

    .input-group .form-control{
      border: none;
      border-radius: 0;
    }

    .input-group .form-control:focus{
      box-shadow: none;
    }

    .input-group-text{
      background: #fff;
      border: none;
      padding: 12px 15px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .input-group-text:hover{
      background: #f8f9fa;
    }

    /* 🔥 Button */
    .btn-danger{
      border-radius: 12px;
      padding: 13px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s;
      background: linear-gradient(45deg, #dc3545, #c82333);
      border: none;
      box-shadow: 0 4px 15px rgba(220,53,69,0.3);
    }

    .btn-danger:active{
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(220,53,69,0.3);
    }

    .error-msg{
      background: #fff5f5;
      border-left: 4px solid #dc3545;
      padding: 12px 15px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 15px;
      text-align: center;
    }

    /* Mobile Optimizations - Properly Centered */
    @media (max-width: 576px){
      body{
        padding: 15px 10px;
        /* Keep proper centering - DO NOT use flex-start */
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .login-card{
        padding: 35px 25px;
        border-radius: 18px;
        margin: 0 auto;
      }

      h3{
        font-size: 24px;
        margin-bottom: 20px;
      }

      label{
        font-size: 14px;
      }

      .form-control{
        padding: 11px 14px;
        font-size: 16px;
      }

      .input-group-text{
        padding: 11px 14px;
      }

      .btn-danger{
        padding: 12px;
        font-size: 16px;
      }

      .error-msg{
        font-size: 13px;
        padding: 10px 12px;
      }
    }

    @media (max-width: 380px){
      .login-card{
        padding: 30px 20px;
      }

      h3{
        font-size: 22px;
      }

      .form-control{
        font-size: 15px;
      }

      .btn-danger{
        font-size: 15px;
        padding: 11px;
      }
    }

    /* Laptop/Desktop - Ensure perfect centering */
    @media (min-width: 768px){
      .login-card{
        padding: 45px 40px;
      }

      h3{
        font-size: 28px;
      }

      .form-control{
        padding: 13px 16px;
        font-size: 16px;
      }

      .btn-danger{
        padding: 14px;
        font-size: 17px;
      }
    }

  </style>
</head>

<body>

<div class="login-card">

<h3 class="text-center mb-4">🔐 Admin Login</h3>

<form id="loginForm">

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" id="email" placeholder="Enter your email" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>

<div class="input-group">

<input type="password" class="form-control" id="password" placeholder="Enter your password" required>

<span class="input-group-text" style="cursor:pointer;" onclick="togglePassword()" title="Toggle password visibility">

<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
<path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8z"/>
<path d="M8 3a5 5 0 1 0 0 10A5 5 0 0 0 8 3z"/>
</svg>

</span>

</div>
</div>

<input type="hidden" id="role" value="admin">

<button type="submit" class="btn btn-danger w-100">Login</button>

</form>

<div id="error" class="error-msg" style="display:none;"></div>

</div>


<script>

function togglePassword(){
const pass=document.getElementById('password');
pass.type = pass.type === "password" ? "text" : "password";
}

document.getElementById('loginForm').addEventListener('submit', async (e)=>{

e.preventDefault();

const email=document.getElementById('email').value;
const password=document.getElementById('password').value;
const role=document.getElementById('role').value;

const res=await fetch('/api/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({email,password,role})
});

const data=await res.json();

if(data.success){
window.location.href=data.redirect;
}else{
const errorEl=document.getElementById('error');
errorEl.textContent=data.message;
errorEl.style.display='block';
// Hide error after 5 seconds
setTimeout(()=>{
errorEl.style.display='none';
},5000);
}

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
