<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Sports Portal</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    *{
      -webkit-tap-highlight-color: transparent;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 20px 15px;

      /* 🔥 REAL SPORTS BACKGROUND (LIKE YOUR IMAGE) */
      background-image: url("https://img.freepik.com/free-photo/sports-tools-grass_53876-138077.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      margin: 0;
    }

    /* 🔥 DARK OVERLAY (for readability) */
    body::before{
      content:"";
      position:absolute;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.45);
      z-index:0;
    }

    /* 🔥 GLASS CARD */
    .portal-card{
      position: relative;
      z-index:1;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(18px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 15px 45px rgba(0,0,0,0.4);
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
      margin: 0 auto;
    }

    /* Animation */
    @keyframes fadeIn{
      from{
        opacity:0;
        transform: translateY(30px);
      }
      to{
        opacity:1;
        transform: translateY(0);
      }
    }

    .trophy-icon{
      font-size: 48px;
      margin-bottom: 15px;
      display: block;
    }

    h1{
      font-weight: 700;
      color:#222;
      font-size: 28px;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    p{
      color:#555;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* QR Container - Like Dashboard Cards */
    .qr-container{
      background: #fff;
      border-radius: 16px;
      padding: 25px;
      margin: 25px 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: inline-block;
      width: 100%;
      max-width: 280px;
    }

    .qr-img{
      width: 100%;
      max-width: 240px;
      height: auto;
      border-radius: 12px;
      display: block;
      margin: 0 auto;
    }

    .or-text{
      color: #666;
      font-size: 15px;
      margin: 20px 0 15px 0;
      font-weight: 500;
    }

    /* 🔥 Button - Like Dashboard */
    .btn-primary{
      border-radius: 12px;
      padding: 14px 35px;
      font-weight: 600;
      font-size: 17px;
      transition: all 0.3s;
      background: linear-gradient(45deg,#00c6ff,#007bff);
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 300px;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,123,255,0.3);
    }

    .btn-primary:active{
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(0,123,255,0.3);
    }

    .url-text{
      color: #888;
      font-size: 13px;
      margin-top: 15px;
      word-break: break-all;
      line-height: 1.4;
    }

    /* Mobile Optimizations */
    @media (max-width: 576px){
      body{
        padding: 15px 10px;
        align-items: flex-start;
        padding-top: 30px;
      }

      .portal-card{
        padding: 30px 20px;
        border-radius: 16px;
      }

      .trophy-icon{
        font-size: 42px;
      }

      h1{
        font-size: 24px;
      }

      p{
        font-size: 15px;
      }

      .qr-container{
        padding: 20px;
        margin: 20px 0;
      }

      .qr-img{
        max-width: 200px;
      }

      .btn-primary{
        padding: 13px 25px;
        font-size: 16px;
        max-width: 100%;
      }

      .url-text{
        font-size: 12px;
      }
    }

    @media (max-width: 380px){
      h1{
        font-size: 22px;
      }

      .qr-img{
        max-width: 180px;
      }

      .btn-primary{
        font-size: 15px;
        padding: 12px 20px;
      }
    }

  </style>

</head>

<body>

  <div class="portal-card">

    <span class="trophy-icon">🏆</span>
    
    <h1>Sports Management Portal</h1>

    <p>Scan the QR code or tap the link below to access the portal.</p>
    
    <div class="qr-container">
      <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code" class="qr-img">
    </div>

    <p class="or-text">Or tap here:</p>

    <a href="{{ portal_url }}" class="btn btn-primary">
      <span>🔗</span>
      <span>Open Portal</span>
    </a>
    
    <p class="url-text">https://sports-portal-supabase.onrender.com</p>

  </div>

</body>
</html>
