<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sports Portal</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;

      /* 🔥 NEW MULTI-SPORT BACKGROUND */
      background-image: url("https://images.unsplash.com/photo-1517649763962-0c623066013b");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    /* 🔥 Dark overlay for premium look */
    body::before{
      content:"";
      position:absolute;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.45);
      z-index:0;
    }

    /* Glass Card Effect */
    .portal-card{
      position: relative;
      z-index:1;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 35px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    /* Smooth Animation */
    @keyframes fadeIn{
      from{
        opacity:0;
        transform: translateY(30px);
      }
      to{
        opacity:1;
        transform: translateY(0);
      }
    }

    h1{
      font-weight: 700;
      color:#222;
    }

    p{
      color:#555;
    }

    /* QR */
    .qr-img{
      max-width: 240px;
      border-radius: 15px;
      padding: 12px;
      background: #fff;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    /* Button Styling */
    .btn-primary{
      border-radius: 30px;
      padding: 12px 30px;
      font-weight: 500;
      transition: 0.3s;
      background: linear-gradient(45deg,#007bff,#00c6ff);
      border: none;
    }

    .btn-primary:hover{
      transform: scale(1.07);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

  </style>

</head>

<body>

  <div class="portal-card">

    <h1 class="mb-3">🏆 Sports Management Portal</h1>

    <p>Scan the QR code or tap the link below to access the portal.</p>
    
    <div class="my-4">
      <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code" class="qr-img">
    </div>

    <p class="text-muted">Or tap here:</p>

    <a href="{{ portal_url }}" class="btn btn-primary btn-lg">
      🔗 Open Portal
    </a>

  </div>

</body>
</html>
