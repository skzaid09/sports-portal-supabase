<!DOCTYPE html>
<html>
<head>
<title>Single Player Registration</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#a76976,#53071a);
min-height:100vh;
}

.navbar{
background:linear-gradient(to right,#280005,#570416);
}

.card{
border-radius:18px;
background:rgba(255,255,255,0.95);
}

@media (max-width:768px){

.card{
padding:20px;
}

}

</style>

</head>

<body>

<nav class="navbar navbar-dark shadow">
<div class="container-fluid px-3">
<span class="navbar-brand fw-bold">🧍 Player Registration</span>
<a href="/" class="btn btn-outline-light btn-sm">Logout</a>
</div>
</nav>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-6 col-md-8 col-12">

<div class="card shadow p-4">

<h4 class="mb-4 text-center">Single Player Registration</h4>

<form id="paymentForm">

<input class="form-control w-100 mb-2" id="name" placeholder="Full Name" required>

<input class="form-control w-100 mb-2" id="department" placeholder="Department" required>

<input class="form-control w-100 mb-2" id="roll_no" placeholder="Roll Number" required>

<select class="form-control w-100 mb-2" id="sport" required>
<option value="">Select Sport</option>
</select>

<div id="loader" class="text-center mb-3" style="display:none;">
<div class="spinner-border text-primary"></div>
<p class="mt-2">Registering Player...</p>
</div>

<button class="btn btn-dark w-100">Register Player</button>

</form>

</div>

</div>

</div>

</div>


<div class="position-fixed bottom-0 end-0 p-3">

<div id="liveToast" class="toast text-bg-success border-0">

<div class="d-flex">

<div class="toast-body" id="toastMessage"></div>

<button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

function showToast(message,type="success"){
const toastEl=document.getElementById("liveToast")
toastEl.className="toast text-bg-"+type+" border-0"
document.getElementById("toastMessage").innerText=message
new bootstrap.Toast(toastEl).show()
}


async function loadIndividualEvents(){

try{

const res = await fetch("/player/api/events")
const events = await res.json()

let options = "<option value=''>Select Sport</option>"

events.forEach(e=>{
if(e.type && e.type.toLowerCase() === "individual"){
options += `<option value="${e.name}">${e.name}</option>`
}
})

document.getElementById("sport").innerHTML = options

}catch(err){
console.log("Error loading events:", err)
}

}


document.getElementById("paymentForm").addEventListener("submit",async function(e){

e.preventDefault()

const loader=document.getElementById("loader")
loader.style.display="block"

const data={
name:name.value,
department:department.value,
roll_no:roll_no.value,
sport:sport.value
}

const res=await fetch("/player/api/register-single",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
})

const result = await res.json()

loader.style.display="none"

if(result.success){
showToast("Registration Successful")
this.reset()
}else{
showToast("Registration Failed","danger")
}
})

loadIndividualEvents()

</script>

</body>
</html>
