<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background: linear-gradient(135deg,#fc466b,#3f5efb);
  min-height:100vh;
}
.navbar{
  background: linear-gradient(to right,#000428,#004e92);
}
.card{
  border-radius:20px;
  background:rgba(255,255,255,0.95);
}
.btn-success{
  border-radius:30px;
  transition:0.3s;
}
.btn-success:hover{
  transform:scale(1.05);
}
.remove-btn{
  cursor:pointer;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark shadow">
  <div class="container">
    <span class="navbar-brand fw-bold">🤝 Team Registration</span>
    <a href="/qr" class="btn btn-outline-light btn-sm">Logout</a>
  </div>
</nav>

<div class="container py-5">
<div class="row justify-content-center">
<div class="col-lg-7">

<div class="card shadow-lg p-4">

<h3 class="text-center mb-4">Register Team</h3>

<form id="teamForm">

<input type="text" class="form-control mb-3" id="team_name" placeholder="Team Name" required>
<input type="text" class="form-control mb-3" id="department" placeholder="Department" required>

<select class="form-select mb-3" id="sport" required>
<option value="">Select Sport</option>
<option>Cricket</option>
<option>Football</option>
<option>Basketball</option>
<option>Volleyball</option>
<option>Hockey</option>
</select>

<h5 class="mt-3">Team Members</h5>

<div id="players-container">
<div class="row g-2 mb-2 player-row">
<div class="col-md-5"><input class="form-control player-name" placeholder="Player Name" required></div>
<div class="col-md-5"><input class="form-control player-roll" placeholder="Roll No" required></div>
<div class="col-md-2 d-flex align-items-center">
<button type="button" class="btn btn-sm btn-danger remove-btn" onclick="removePlayer(this)">X</button>
</div>
</div>
</div>

<button type="button" class="btn btn-outline-primary mb-3" onclick="addPlayer()">+ Add Player</button>

<div id="loader" class="text-center mb-3" style="display:none;">
<div class="spinner-border text-primary"></div>
<p class="mt-2">Registering team...</p>
</div>

<button type="submit" class="btn btn-success w-100">Register Team</button>

</form>

<a href="/player/register" class="btn btn-link mt-3">← Back to Options</a>

</div>
</div>
</div>
</div>

<!-- TOAST -->
<div class="position-fixed bottom-0 end-0 p-3">
<div id="liveToast" class="toast text-bg-success border-0">
<div class="d-flex">
<div class="toast-body" id="toastMessage"></div>
<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function showToast(message,type="success"){
  const toastEl=document.getElementById('liveToast');
  toastEl.className="toast text-bg-"+type+" border-0";
  document.getElementById('toastMessage').innerText=message;
  new bootstrap.Toast(toastEl).show();
}

function addPlayer(){
  const container=document.getElementById("players-container");
  const row=document.createElement("div");
  row.className="row g-2 mb-2 player-row";
  row.innerHTML=`
  <div class="col-md-5"><input class="form-control player-name" placeholder="Player Name" required></div>
  <div class="col-md-5"><input class="form-control player-roll" placeholder="Roll No" required></div>
  <div class="col-md-2 d-flex align-items-center">
    <button type="button" class="btn btn-sm btn-danger remove-btn" onclick="removePlayer(this)">X</button>
  </div>`;
  container.appendChild(row);
}

function removePlayer(btn){
  btn.closest(".player-row").remove();
}

document.getElementById("teamForm").addEventListener("submit",async function(e){
e.preventDefault();

const teamName=document.getElementById("team_name").value;
const dept=document.getElementById("department").value;
const sportValue=document.getElementById("sport").value;

if(!teamName || !dept || !sportValue){
  showToast("Please fill all team details","danger");
  return;
}

const players=[];
let valid=true;

document.querySelectorAll(".player-row").forEach(row=>{
  const name=row.querySelector(".player-name").value.trim();
  const roll=row.querySelector(".player-roll").value.trim();

  if(!name || !roll){
    valid=false;
  }

  players.push({name:name, roll_no:roll});
});

if(!valid || players.length===0){
  showToast("All player fields are required","danger");
  return;
}

document.getElementById("loader").style.display="block";

try{
const res=await fetch("/player/api/register-team",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
team_name:teamName,
department:dept,
sport:sportValue,
players:players
})
});

const result=await res.json();
document.getElementById("loader").style.display="none";

if(result.success){
  showToast("🎉 Team Registered Successfully!");
  setTimeout(()=>{ window.location.href="/roles"; },1500);
}else{
  showToast(result.error || "Registration Failed","danger");
}

}catch(err){
document.getElementById("loader").style.display="none";
showToast("Server Error","danger");
}
});
</script>

</body>
</html>
