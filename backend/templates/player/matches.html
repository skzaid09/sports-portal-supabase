<!DOCTYPE html>
<html>

<head>

<title>Match Schedule</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh;
}

.navbar{
background:linear-gradient(to right,#000428,#004e92);
}

.card{
border-radius:18px;
background:rgba(255,255,255,0.95);
}

@media (max-width:768px){

.container{
padding-left:15px;
padding-right:15px;
}

h4{
font-size:18px;
}

}

</style>

</head>

<body>

<nav class="navbar navbar-dark shadow">

<div class="container-fluid px-3">

<span class="navbar-brand fw-bold">📅 Match Schedule</span>

<a href="/player/register" class="btn btn-outline-light btn-sm">
Back
</a>

</div>

</nav>


<div class="container mt-5">

<div class="card shadow p-4">

<h4 class="mb-3">Scheduled Matches</h4>
<div class="table-responsive">
<table class="table table-striped">

<thead class="table-dark">

<tr>
<th>Event</th>
<th>Team 1</th>
<th>Team 2</th>
<th>Date</th>
<th>Status</th>
</tr>

</thead>

<tbody id="matchTable"></tbody>

</table>

</div>

</div>


<script>

async function loadMatches(){

const res = await fetch("/coord/api/get-matches")

const matches = await res.json()

// Sort matches by date in ascending order (chronological)
matches.sort((a, b) => {
return new Date(a.date) - new Date(b.date)
})

let rows=""

matches.forEach(m=>{

rows += `
<tr>
<td>${m.event || "-"}</td>
<td>${m.team1}</td>
<td>${m.team2}</td>
<td>${m.date}</td>
<td>${m.status}</td>
</tr>
`

})

document.getElementById("matchTable").innerHTML = rows

}

loadMatches()

</script>

</body>
</html>
