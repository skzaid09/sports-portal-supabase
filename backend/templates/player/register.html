<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background: linear-gradient(135deg,#eef2f3,#dfe9f3);
min-height:100vh;
}

.navbar{
background:#000;
}

.reg-card{
border-radius:18px;
transition:0.3s;
cursor:pointer;
}

.reg-card:hover{
transform:translateY(-6px);
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.icon{
font-size:50px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark shadow">
<div class="container">

<span class="navbar-brand fw-bold">
🏅 Player Dashboard
</span>

<a href="/" class="btn btn-outline-light btn-sm">
Logout
</a>

</div>
</nav>

<div class="container mt-5">

<h2 class="mb-4">🎯 Register for Events</h2>

<div class="row g-4">

<div class="col-md-4">
<div class="card reg-card text-center p-4 shadow"
onclick="window.location='/player/register/single'">

<div class="icon mb-3">🧍</div>
<h4>Single Player</h4>
<p class="text-muted">Register for individual sports</p>

</div>
</div>

<div class="col-md-4">
<div class="card reg-card text-center p-4 shadow"
onclick="window.location='/player/register/team'">

<div class="icon mb-3">🤝</div>
<h4>Team Registration</h4>
<p class="text-muted">Register a full team</p>

</div>
</div>

<div class="col-md-4">
<div class="card reg-card text-center p-4 shadow"
onclick="window.location='/player/events'">

<div class="icon mb-3">🏆</div>
<h4>View Event Schedule</h4>
<p class="text-muted">See all upcoming events</p>

</div>
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
