<!DOCTYPE html>
<html>

<head>

<title>Event Schedule</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>


body{
background:linear-gradient(135deg,#667eea,#4ba261);
min-height:100vh;
}

.navbar{
background:linear-gradient(to right,#000428,#009292);
}

.card{
border-radius:18px;
background:rgba(255,255,255,0.95);
}

@media (max-width:768px){

.container{
padding-left:15px;
padding-right:15px;
}

h4{
font-size:18px;
}

}

</style>

</head>

<body>

<nav class="navbar navbar-dark shadow">
<div class="container-fluid px-3">
<span class="navbar-brand fw-bold">
🏆 Event Schedule
</span>

<a href="/player/register" class="btn btn-outline-light btn-sm">
Back
</a>

</div>
</nav>


<div class="container mt-5">

<!-- INDIVIDUAL EVENTS -->

<div class="card shadow p-4 mb-4">

<h4 class="mb-3">🧍 Individual Events</h4>
<div class="table-responsive">
<table class="table table-striped">

<thead class="table-dark">
<tr>
<th>Event Name</th>
<th>Date</th>
<th>Location</th>
</tr>
</thead>

<tbody id="individualTable"></tbody>

</table>

</div>
</div>

<!-- TEAM EVENTS -->

<div class="card shadow p-4">

<h4 class="mb-3">👥 Team Events</h4>
<div class="table-responsive">
<table class="table table-striped">

<thead class="table-dark">
<tr>
<th>Event Name</th>
<th>Date</th>
<th>Location</th>
</tr>
</thead>

<tbody id="teamTable"></tbody>

</table>

</div>
</div>


<script>

async function loadEvents(){

const res = await fetch("/player/api/events")

const events = await res.json()

let individualRows=""
let teamRows=""

events.forEach(e=>{

if(e.type === "Individual"){

individualRows += `
<tr>
<td>${e.name}</td>
<td>${e.date}</td>
<td>${e.location}</td>
</tr>
`

}

if(e.type === "Team"){

teamRows += `
<tr>
<td>${e.name}</td>
<td>${e.date}</td>
<td>${e.location}</td>
</tr>
`

}

})

document.getElementById("individualTable").innerHTML = individualRows
document.getElementById("teamTable").innerHTML = teamRows

}

loadEvents()

</script>

</body>
</html>
