<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Role</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;

      /* 🔥 SPORTS BACKGROUND */
      background-image: url("https://img.freepik.com/free-photo/sports-tools_53876-138077.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Glass Card */
    .role-card{
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    /* Animation */
    @keyframes fadeIn{
      from{
        opacity:0;
        transform: translateY(20px);
      }
      to{
        opacity:1;
        transform: translateY(0);
      }
    }

    h2{
      font-weight: 600;
      margin-bottom: 30px;
    }

    /* Buttons */
    .btn-role{
      border-radius: 50px;
      padding: 14px;
      font-size: 16px;
      font-weight: 500;
      transition: 0.3s;
    }

    .btn-role:hover{
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    .btn-back{
      border-radius: 30px;
      padding: 8px 20px;
    }

  </style>

</head>

<body>

  <div class="role-card">

    <h2>Choose Your Role</h2>

    <div class="d-grid gap-3">

      <a href="/admin/login" class="btn btn-danger btn-role">
        🔐 Admin Login
      </a>

      <a href="/coord/login" class="btn btn-warning btn-role">
        📋 Coordinator Login
      </a>

      <a href="/player/register" class="btn btn-success btn-role">
        🏅 Player Registration
      </a>

    </div>

    <div class="mt-4">
      <a href="/" class="btn btn-outline-secondary btn-back">
        ← Back to QR
      </a>
    </div>

  </div>

</body>
</html>
